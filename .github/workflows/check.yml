name: Check and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run local mock tests
        run: npm test
      - name: Check settings layout and appearance
        run: node test/settings-layout.js
        env:
          UI_SCREENSHOTS: '0'
      - name: Check desktop and mobile interface
        run: node test/chat-ui-e2e.js
        env:
          UI_SCREENSHOTS: '0'

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Verify native single-submit transport with a local mock relay
        run: |
          mkdir -p "$RUNNER_TEMP/native-tests"
          javac -d "$RUNNER_TEMP/native-tests" android/app/src/main/java/com/jianmiao/imagestudio/RelayClient.java test/java/RelayClientTest.java
          java -cp "$RUNNER_TEMP/native-tests" com.jianmiao.imagestudio.RelayClientTest
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Verify offline album saving
        run: |
          javac -cp "$ANDROID_HOME/platforms/android-35/android.jar" -d "$RUNNER_TEMP/native-tests" android/app/src/main/java/com/jianmiao/imagestudio/AlbumSaver.java test/java/AlbumSaverTest.java
          java -cp "$RUNNER_TEMP/native-tests:$ANDROID_HOME/platforms/android-35/android.jar" com.jianmiao.imagestudio.AlbumSaverTest
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GPT-Image-2-Studio-android
          path: android/app/build/outputs/apk/debug/app-debug.apk

  android-device:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Build app and native gallery tests
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test photo selection on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            bash test/android-picker-e2e.sh
            bash test/android-picker-e2e.sh --scenario=denied
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-gallery-verification
          path: test/.artifacts/android-picker/
