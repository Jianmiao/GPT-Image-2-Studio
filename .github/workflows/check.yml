name: Check and build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Run local mock tests
        run: npm test
      - name: Check desktop and mobile interface
        run: node test/chat-ui-e2e.js

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Verify native single-submit transport with a local mock relay
        run: |
          mkdir -p "$RUNNER_TEMP/native-tests"
          javac -d "$RUNNER_TEMP/native-tests" android/app/src/main/java/com/jianmiao/imagestudio/RelayClient.java test/java/RelayClientTest.java
          java -cp "$RUNNER_TEMP/native-tests" com.jianmiao.imagestudio.RelayClientTest
      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build installable APK
        working-directory: android
        run: bash ./gradlew --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: GPT-Image-2-Studio-android
          path: android/app/build/outputs/apk/debug/app-debug.apk
